# Push a tag like v0.2 to build MacRemote, sign it with the self-signed
# "MacRemote Signing" certificate, and publish MacRemote-0.2.zip on Releases.
#
# Actions > Release > Run workflow is a test run: it does the same build and
# signing but publishes nothing; the zip is a download on the run's page.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CERT_P12_BASE64  the certificate and key: base64 -i cert.p12
#   CERT_PASSWORD    the .p12 password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      # Pinned to a commit so a changed tag cannot run new code next to the signing
      # certificate. Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Xcode this app is built and tested with locally. Xcode 26.6 (Swift 6.3.3)
      # crashed compiling MacRemote in release mode.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app && swift --version

      - name: Unit tests
        run: swift test --scratch-path "$RUNNER_TEMP/test-build"

      - name: Import the signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          [[ -n "$CERT_P12_BASE64" && -n "$CERT_PASSWORD" ]] || { echo "::error::Add the CERT_P12_BASE64 and CERT_PASSWORD secrets"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          p12="$RUNNER_TEMP/cert.p12"
          kcpass=$(uuidgen)
          echo "$CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kcpass" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$kcpass" "$KEYCHAIN"
          security import "$p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$p12"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Build, sign, and zip
        env:
          SIGN_IDENTITY: MacRemote Signing
        # A test run has no tag, so the version comes from Info.plist.in.
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          tools/release.sh

      - name: Keep the zip of a test run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacRemote-test-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "MacRemote ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
